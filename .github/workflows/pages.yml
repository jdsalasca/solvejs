name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - packages/**
      - scripts/prepare-docs-vendor.mjs
      - scripts/version-docs-assets.mjs
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Copy package builds for the Live Lab
        run: node scripts/prepare-docs-vendor.mjs

      - name: Version docs assets and vendor bundles
        run: node scripts/version-docs-assets.mjs docs ${{ github.run_id }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
