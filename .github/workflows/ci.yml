name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test-matrix:
    name: Test Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check quality baseline
        run: npm run lint:quality

      - name: Enforce test baseline
        run: npm run test:baseline

      - name: Check docs links
        run: npm run docs:check-links

      - name: Pack dry run
        run: npm pack --workspaces --dry-run

      - name: Check CommonJS output
        run: npm run check:cjs

      - name: Check package manifests with publint
        run: npm run check:publint

      - name: Check publish contents
        run: npm run check:pack

      - name: Check meta package wiring
        run: npm run check:meta

      - name: Check release matrix covers every package
        run: npm run check:release

      - name: Check README snippets parse
        run: npm run check:snippets

      - name: Check JSDoc attachment
        run: npm run check:jsdoc

      - name: Generate inventory report
        run: npm run inventory

      - name: Generate performance and size report
        run: npm run report:perf

      - name: Generate package health report
        run: npm run report:health

      - name: Test
        run: npm test
